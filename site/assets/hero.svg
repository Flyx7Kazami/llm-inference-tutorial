<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960">
  <defs>
    <radialGradient id="hg-blue" cx="0.14" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hg-violet" cx="0.94" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hg-amber" cx="0.5" cy="1.12" r="0.8">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.13"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hg-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#09090b" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="960" fill="#fafafa"/>
  <rect width="1200" height="960" fill="url(#hg-blue)"/>
  <rect width="1200" height="960" fill="url(#hg-violet)"/>
  <rect width="1200" height="960" fill="url(#hg-amber)"/>
  <rect width="1200" height="960" fill="url(#hg-dots)"/>

  <!-- brand echo -->
  <circle cx="215" cy="205" r="96" fill="#ffffff" fill-opacity="0.4" stroke="#09090b" stroke-opacity="0.08" stroke-width="1.5"/>
  <text x="215" y="238" font-family="Georgia, serif" font-style="italic" font-size="92" fill="#09090b" fill-opacity="0.15" text-anchor="middle">&#x3BB;</text>

  <!-- GPU cards -->
  <g>
    <rect x="812" y="130" width="100" height="100" rx="16" fill="#ffffff" fill-opacity="0.65" stroke="#09090b" stroke-opacity="0.12"/>
    <rect x="838" y="156" width="48" height="48" rx="9" fill="none" stroke="#09090b" stroke-opacity="0.18"/>
    <path d="M800 158 h12 M800 180 h12 M800 202 h12" stroke="#09090b" stroke-opacity="0.14" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="948" y="104" width="100" height="100" rx="16" fill="#ffffff" fill-opacity="0.65" stroke="#09090b" stroke-opacity="0.12"/>
    <rect x="974" y="130" width="48" height="48" rx="9" fill="none" stroke="#09090b" stroke-opacity="0.18"/>
    <path d="M936 132 h12 M936 154 h12 M936 176 h12" stroke="#09090b" stroke-opacity="0.14" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="1084" y="138" width="100" height="100" rx="16" fill="#ffffff" fill-opacity="0.65" stroke="#09090b" stroke-opacity="0.12"/>
    <rect x="1110" y="164" width="48" height="48" rx="9" fill="none" stroke="#09090b" stroke-opacity="0.18"/>
    <path d="M1072 166 h12 M1072 188 h12 M1072 210 h12" stroke="#09090b" stroke-opacity="0.14" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- prefill / decode curve -->
  <path d="M 90 780 C 260 772, 330 700, 420 600 C 500 512, 580 470, 700 462 C 840 452, 960 440, 1110 438" fill="none" stroke="#2563eb" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round"/>
  <circle cx="700" cy="462" r="6" fill="#2563eb" fill-opacity="0.4"/>
  <path d="M 700 462 L 700 780" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="452" y="566" font-family="Menlo, monospace" font-size="14" fill="#2563eb" fill-opacity="0.55">prefill</text>
  <text x="1006" y="416" font-family="Menlo, monospace" font-size="14" fill="#2563eb" fill-opacity="0.55">decode</text>

  <!-- decode steps -->
  <path d="M 90 845 L 240 845 L 240 808 L 390 808 L 390 771 L 540 771 L 540 734 L 690 734 L 690 697 L 840 697" fill="none" stroke="#18181b" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="840" cy="697" r="5" fill="#18181b" fill-opacity="0.3"/>

  <!-- KV cache blocks -->
  <g>
    <g id="kv-row">
      <rect x="90"  y="592" width="26" height="26" rx="6" fill="#2563eb" fill-opacity="0.28"/>
      <rect x="126" y="592" width="26" height="26" rx="6" fill="#2563eb" fill-opacity="0.28"/>
      <rect x="162" y="592" width="26" height="26" rx="6" fill="#10b981" fill-opacity="0.3"/>
      <rect x="198" y="592" width="26" height="26" rx="6" fill="none" stroke="#09090b" stroke-opacity="0.14"/>
      <rect x="234" y="592" width="26" height="26" rx="6" fill="#d97706" fill-opacity="0.3"/>
      <rect x="270" y="592" width="26" height="26" rx="6" fill="none" stroke="#09090b" stroke-opacity="0.14"/>
      <rect x="306" y="592" width="26" height="26" rx="6" fill="#2563eb" fill-opacity="0.28"/>
      <rect x="342" y="592" width="26" height="26" rx="6" fill="none" stroke="#09090b" stroke-opacity="0.14"/>
      <rect x="378" y="592" width="26" height="26" rx="6" fill="#7c3aed" fill-opacity="0.26"/>
      <rect x="414" y="592" width="26" height="26" rx="6" fill="none" stroke="#09090b" stroke-opacity="0.14"/>
    </g>
    <use href="#kv-row" y="36"/>
    <use href="#kv-row" y="72"/>
  </g>
  <text x="90" y="716" font-family="Menlo, monospace" font-size="13" fill="#52525b" fill-opacity="0.6">KV cache blocks</text>

  <!-- scattered marks -->
  <g stroke="#09090b" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round">
    <path d="M 620 200 v18 M 611 209 h18"/>
    <path d="M 1120 620 v18 M 1111 629 h18"/>
    <path d="M 160 420 v18 M 151 429 h18"/>
  </g>
</svg>
